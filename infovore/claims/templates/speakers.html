<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>speaker review</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 13px/18px ui-monospace, Menlo, monospace; background: #fff; color: #111; }
#bar { position: sticky; top: 0; display: flex; gap: 18px; height: 32px; align-items: center; padding: 0 10px; background: #eee; border-bottom: 1px solid #ccc; }
#err { color: #a00; }
.speaker { border-bottom: 2px solid #999; padding: 8px 12px; }
.speaker.drop { background: #fdd; }
.speaker.keep { background: #dfd; }
.head { display: flex; gap: 12px; align-items: center; font-weight: bold; }
.head .state { color: #555; min-width: 5em; }
button { font: inherit; padding: 2px 10px; cursor: pointer; }
.claim { padding: 2px 0 2px 12px; }
.claim .v { color: #666; }
@media (max-width: 800px), (pointer: coarse) {
  body { font-size: 15px; line-height: 21px; }
  #bar { height: auto; flex-wrap: wrap; gap: 8px; padding: 6px 10px; }
  .head { flex-wrap: wrap; }
  button { font-size: 16px; padding: 10px 18px; }
}
</style>
</head>
<body>
<div id="bar"><span id="progress"></span><button id="keepall">keep all undecided</button><span id="err"></span></div>
<div id="list"></div>
<script>
"use strict";
const list = document.getElementById("list"), progress = document.getElementById("progress"), err = document.getElementById("err");
let all = [];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function decide(s, decision) {
  err.textContent = "";
  try {
    const r = await fetch("/api/speaker", { method: "POST", body: JSON.stringify({ rank: s.rank, decision }) });
    if (!r.ok) { err.textContent = (await r.json()).error; return; }
    s.decision = decision; render();
  } catch (e) { err.textContent = String(e); }
}

function render() {
  list.textContent = "";
  let open = 0;
  for (const s of all) {
    if (!s.decision) open++;
    const d = el("div", "speaker " + (s.decision || ""));
    const head = el("div", "head");
    const drop = el("button", "", "drop"), keep = el("button", "", "keep");
    drop.onclick = () => decide(s, "drop");
    keep.onclick = () => decide(s, "keep");
    head.append(el("span", "", s.label), el("span", "", s.total + " claims"), el("span", "state", s.decision || "undecided"), keep, drop);
    d.appendChild(head);
    for (const c of s.sample) {
      const line = el("div", "claim", c.statement);
      if (c.verdict) line.append(el("span", "v", "  [" + c.verdict.replace("_", " ") + "]"));
      d.appendChild(line);
    }
    list.appendChild(d);
  }
  progress.textContent = open + " of " + all.length + " undecided";
}

document.getElementById("keepall").onclick = async () => {
  for (const s of all) if (!s.decision) await decide(s, "keep");
};

fetch("/api/speakers").then(r => r.json()).then(data => { all = data.speakers; render(); });
</script>
</body>
</html>
