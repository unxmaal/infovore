<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claim review</title>
<style>
body { margin: 0; font: 12px/16px ui-monospace, Menlo, monospace; background: #fff; color: #111; }
#bar { position: sticky; top: 0; z-index: 1; display: flex; gap: 16px; height: 28px; align-items: center; padding: 0 8px; background: #eee; }
#msg { color: #a00; }
table { border-collapse: collapse; width: 100%; }
td { vertical-align: top; padding: 2px 8px; border-bottom: 1px solid #ddd; }
td.v { width: 70px; font-weight: bold; }
td.c { width: 38%; }
td.s div { color: #444; }
td.s b { color: #111; }
tr.cur { background: #ffd; outline: 2px solid #cc0; }
tr.good td.v { color: #070; }
tr.wrong td.v { color: #a60; }
tr.made_up td.v { color: #a00; }
tr.not_useful td.v { color: #666; }
</style>
</head>
<body>
<div id="bar"><span>g good</span><span>w wrong</span><span>m made up</span><span>n not useful</span><span>up/down move</span><span id="left"></span><span id="msg"></span></div>
<table><tbody id="rows"></tbody></table>
<script>
"use strict";
const rows = document.getElementById("rows"), left = document.getElementById("left"), msg = document.getElementById("msg");
const KEYS = { 'g': "good", 'w': "wrong", 'm': "made_up", 'n': "not_useful" };
let claims = [], cur = 0, trs = [];

function mark(i) {
  const c = claims[i];
  trs[i].className = (c.verdict || "") + (i === cur ? " cur" : "");
  trs[i].firstChild.textContent = c.verdict ? c.verdict.replace("_", " ") : "";
}

function build(data) {
  claims = data.claims; cur = data.first_unreviewed;
  if (cur >= claims.length) cur = Math.max(0, claims.length - 1);
  rows.textContent = ""; trs = [];
  for (const c of claims) {
    const tr = document.createElement("tr");
    const v = document.createElement("td"); v.className = "v";
    const t = document.createElement("td"); t.className = "c"; t.textContent = c.statement;
    const s = document.createElement("td"); s.className = "s";
    for (const m of c.sources) {
      const d = document.createElement("div"), a = document.createElement("b");
      a.textContent = m.author + ": "; d.append(a, m.text); s.appendChild(d);
    }
    tr.append(v, t, s); rows.appendChild(tr); trs.push(tr);
  }
  claims.forEach((_, i) => mark(i));
  count(); focus();
}

function count() {
  left.textContent = claims.filter(c => !c.verdict).length + " of " + claims.length + " left";
}

function focus() {
  if (trs[cur]) trs[cur].scrollIntoView({ block: "center" });
}

function move(to) {
  if (!claims.length) return;
  const old = cur;
  cur = Math.min(claims.length - 1, Math.max(0, to));
  mark(old); mark(cur); focus();
}

async function judge(verdict) {
  const c = claims[cur];
  if (!c) return;
  msg.textContent = "";
  try {
    const r = await fetch("/api/review", { method: "POST", body: JSON.stringify({ claim_id: c.id, verdict }) });
    if (!r.ok) { msg.textContent = (await r.json()).error; return; }
    c.verdict = verdict; mark(cur); count(); move(cur + 1);
  } catch (e) { msg.textContent = String(e); }
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (KEYS[e.key]) { e.preventDefault(); judge(KEYS[e.key]); }
  else if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); move(cur + 1); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); move(cur - 1); }
});

fetch("/api/claims").then(r => r.json()).then(build);
</script>
</body>
</html>
