<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claim review</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 13px/18px ui-monospace, Menlo, monospace; background: #fff; color: #111; }
#bar { position: sticky; top: 0; z-index: 1; display: flex; gap: 18px; height: 32px; align-items: center; padding: 0 10px; background: #eee; border-bottom: 1px solid #ccc; }
#bar .hint { color: #555; }
#progress { font-weight: bold; }
#err { color: #a00; }
#cols { display: flex; height: calc(100vh - 33px); }
#left { flex: 3; overflow-y: auto; padding: 8px 12px; border-right: 1px solid #ccc; }
#right { flex: 2; overflow-y: auto; padding: 8px 12px; }
.win + .win { border-top: 1px dashed #999; margin-top: 8px; padding-top: 8px; }
.line { white-space: pre-wrap; padding: 1px 4px; }
.line .ref { color: #888; }
.line.hl { background: #ff9; }
.claim { border: 1px solid #ccc; padding: 6px 8px; margin-bottom: 8px; cursor: pointer; }
.claim.cur { outline: 2px solid #cc0; background: #ffd; }
.claim .who { color: #666; }
.claim .v { font-weight: bold; min-height: 18px; }
.claim.good .v { color: #070; }
.claim.wrong .v { color: #a60; }
.claim.made_up .v { color: #a00; }
.claim.not_useful .v { color: #666; }
.none { color: #777; padding: 8px; }
</style>
</head>
<body>
<div id="bar"><span class="hint">g good</span><span class="hint">w wrong</span><span class="hint">m made up</span><span class="hint">n not useful</span><span class="hint">j/k claim</span><span class="hint">[ ] conversation</span><span id="progress"></span><span id="where"></span><span id="err"></span></div>
<div id="cols"><div id="left"></div><div id="right"></div></div>
<script>
"use strict";
const left = document.getElementById("left"), right = document.getElementById("right");
const progress = document.getElementById("progress"), where = document.getElementById("where"), err = document.getElementById("err");
const KEYS = { 'g': "good", 'w': "wrong", 'm': "made_up", 'n': "not_useful" };
let convs = [], ci = 0, ki = 0;

function claim() { return convs[ci] && convs[ci].claims[ki]; }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderTranscript() {
  left.textContent = "";
  const c = claim(), cited = new Set(c ? c.refs : []);
  let first = null;
  for (const w of convs[ci].windows) {
    const wd = el("div", "win");
    for (const ln of w) {
      const d = el("div", "line" + (cited.has(ln.ref) ? " hl" : ""));
      d.append(el("span", "ref", "[" + ln.ref + "] "), ln.speaker + ": " + ln.text);
      if (cited.has(ln.ref) && !first) first = d;
      wd.appendChild(d);
    }
    left.appendChild(wd);
  }
  if (first) first.scrollIntoView({ block: "center" });
}

function renderClaims() {
  right.textContent = "";
  convs[ci].claims.forEach((c, i) => {
    const d = el("div", "claim " + (c.verdict || "") + (i === ki ? " cur" : ""));
    d.append(el("div", "v", c.verdict ? c.verdict.replace("_", " ") : ""), el("div", "", c.statement), el("div", "who", c.speaker));
    d.onclick = () => { ki = i; render(); };
    right.appendChild(d);
    if (i === ki) d.scrollIntoView({ block: "nearest" });
  });
}

function count() {
  let left_ = 0, total = 0;
  for (const c of convs) for (const k of c.claims) { total++; if (!k.verdict) left_++; }
  progress.textContent = left_ + " of " + total + " left";
}

function render() {
  count();
  if (!convs.length) { left.textContent = ""; right.textContent = ""; right.appendChild(el("div", "none", "no claims")); return; }
  where.textContent = "conversation " + (ci + 1) + " of " + convs.length + ", claim " + (ki + 1) + " of " + convs[ci].claims.length;
  renderTranscript(); renderClaims();
}

function step(d) {
  if (!convs.length) return;
  ki += d;
  if (ki < 0) { if (ci === 0) ki = 0; else { ci--; ki = convs[ci].claims.length - 1; } }
  else if (ki >= convs[ci].claims.length) { if (ci === convs.length - 1) ki = convs[ci].claims.length - 1; else { ci++; ki = 0; } }
  render();
}

function jump(d) {
  if (!convs.length) return;
  ci = Math.min(convs.length - 1, Math.max(0, ci + d)); ki = 0; render();
}

async function judge(verdict) {
  const c = claim();
  if (!c) return;
  err.textContent = "";
  try {
    const r = await fetch("/api/review", { method: "POST", body: JSON.stringify({ claim_id: c.id, verdict }) });
    if (!r.ok) { err.textContent = (await r.json()).error; return; }
    c.verdict = verdict; step(1);
  } catch (e) { err.textContent = String(e); }
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (KEYS[e.key]) { e.preventDefault(); judge(KEYS[e.key]); }
  else if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
  else if (e.key === ']') { e.preventDefault(); jump(1); }
  else if (e.key === '[') { e.preventDefault(); jump(-1); }
});

fetch("/api/claims").then(r => r.json()).then(data => {
  convs = data.conversations;
  let n = data.first_unreviewed;
  const total = convs.reduce((a, c) => a + c.claims.length, 0);
  if (n >= total) n = Math.max(0, total - 1);
  for (ci = 0; ci < convs.length; ci++) {
    if (n < convs[ci].claims.length) { ki = n; break; }
    n -= convs[ci].claims.length;
  }
  render();
});
</script>
</body>
</html>
